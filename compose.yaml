services:
  kahut:
    build: .
    ports:
      - '${HOST_PORT:-8080}:8080'
    environment:
      AUTH_USERS: '${AUTH_USERS:?Set AUTH_USERS to a JSON array of username:password strings}'
      SESSION_SIGNING_KEY: '${SESSION_SIGNING_KEY:?Set a stable random signing key of at least 32 bytes}'
      DB_PATH: /data/kahut.db
    volumes:
      - kahut-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  kahut-data:
